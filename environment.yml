# Conda environment for the Traffic Violation Detection System.
#
# Create:   conda env create -f environment.yml
# Activate: conda activate tvd
# Install project + notebook dependencies (from the repository root):
#           pip install -e ".[notebooks,dev]"
# On the GPU server, add the detection and tracking extras, then BoxMOT without
# its dependencies (it pins an older opencv-python; see pyproject.toml):
#           pip install -e ".[notebooks,dev,detection,tracking]"
#           pip install --no-deps boxmot==26.0.0
#
# PyTorch comes from PyPI rather than conda: the default PyPI wheel bundles its
# CUDA runtime (verified: torch 2.15.0+cu132 with NVIDIA driver 580).
name: tvd
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
