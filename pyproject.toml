[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-violation-detection"
version = "0.1.0"
description = "AI-assisted traffic violation detection with human review (academic project)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "scipy>=1.11",
    # Provides an ffmpeg binary for writing clips, on machines without a system ffmpeg.
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
notebooks = [
    "notebook>=7",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
]
# GPU server only. Versions verified in Notebook 02: torch 2.15.0 (CUDA 13.2 build,
# NVIDIA driver 580), torchvision 0.29.2, ultralytics 8.4.197.
# Ultralytics is AGPL-3.0 licensed, and it pulls in opencv-python next to
# opencv-python-headless; both must stay at the same version (they share the cv2 module).
detection = [
    "torch>=2.15",
    "torchvision>=0.29",
    "ultralytics>=8.4,<8.5",
]
# GPU server only, for Notebook 03. BoxMOT itself (AGPL-3.0) is NOT listed: boxmot 26.0.0
# pins opencv-python==4.11.0.86, which would downgrade the shared cv2 module. Install it
# without dependencies after this extra; these are its other requirements:
#   pip install -e ".[tracking]" && pip install --no-deps boxmot==26.0.0
# Verified in Notebook 03 with OpenCV 5.0.0 despite the pin (pip check reports the mismatch).
tracking = [
    "click>=8.1.8",
    "filterpy>=1.4.5,<2",
    "gdown>=5.1,<6",
    "huggingface-hub>=1.7.1",
    "lapcpp>=1,<2",
    "pandas>=2,<3",
    "platformdirs>=4.3,<5",
    "pyarrow>=18,<24",
    "rich>=15",
    "scikit-learn>=1.3,<2",
    "scipy>=1.11",
    "threadpoolctl>=3.6,<4",
    "timm>=1.0.15,<2",
    "tqdm>=4.67.1,<5",
]
# For Notebook 06. Use the "onnx" extras instead on a machine without a CUDA GPU.
# The code of both packages is MIT licensed; their READMEs state no license for the model weights.
plates = [
    "fast-plate-ocr[onnx-gpu]>=1.1,<1.2",
    "open-image-models[onnx-gpu]>=0.6,<0.7",
]
# For Notebook 09: tracking scores (MOTA, IDF1). motmetrics is MIT licensed.
evaluation = [
    "motmetrics>=1.4,<2",
]
# For the review service (src/tvd). pydantic (MIT) checks settings files; PyYAML (MIT) reads them.
# FastAPI (MIT) and uvicorn (BSD) serve the REST API; python-multipart (Apache-2.0) reads uploaded files.
service = [
    "pydantic>=2.6,<3",
    "pyyaml>=6.0,<7",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "python-multipart>=0.0.20",
]
# httpx (BSD) is what FastAPI's test client sends requests with.
dev = [
    "pytest>=8",
    "httpx>=0.28,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
